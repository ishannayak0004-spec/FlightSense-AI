name: Collect Indian fare history
on:
  schedule:
    - cron: '37 3 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/collect-fares.yml']
permissions:
  contents: write
concurrency:
  group: flightsense-fare-history
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Open fare history branch
        run: |
          if git ls-remote --exit-code --heads origin fare-history; then
            git fetch --depth=1 origin refs/heads/fare-history:refs/remotes/origin/fare-history
            git worktree add -b fare-history ../fare-archive origin/fare-history
          else
            git worktree add -b fare-history ../fare-archive HEAD
          fi
      - name: Collect daily quotes
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: python forecast/collect.py ../fare-archive/fare-history
      - name: Save successful observations
        if: always()
        working-directory: ../fare-archive
        run: |
          if [ -d fare-history ]; then
            git add -- fare-history
            if ! git diff --cached --quiet; then
              git -c user.name='FlightSense collector' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "Save observed Indian fares"
              git push origin HEAD:refs/heads/fare-history
            fi
          fi
